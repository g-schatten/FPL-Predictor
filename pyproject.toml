[project]
name = "fpl-predictor"
version = "0.1.0"
description = "Local Fantasy Premier League wildcard and transfer recommender"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "pulp>=2.8",
  "highspy>=1.8",
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fpl = "fpl_predictor.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpl_predictor = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
